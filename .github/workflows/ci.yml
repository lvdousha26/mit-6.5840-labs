name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Go 1.22's race binaries trip dyld's LC_UUID check on recent macOS.
          # The module itself only needs 1.22; CI uses a newer toolchain.
          go-version: '1.25'
          # No third-party dependencies, so there is no go.sum to cache.
          cache: false
      - name: vet
        run: go vet ./...
      - name: test with race detector
        run: go test -race ./... -count=1 -timeout=10m
